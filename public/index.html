<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrimeTac Prom AI v7.1</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#111;color:#eee}
.wrap{max-width:1250px;margin:auto;padding:14px}
h1{font-size:24px;margin:0 0 5px}.muted{color:#aaa}.small{font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}
.card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:13px;margin:10px 0}
.good{color:#8fd18f}.warn{color:#ffd27f}.bad{color:#ff8b8b}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}
.stat{background:#161616;border:1px solid #303030;border-radius:12px;padding:10px}
.stat b{display:block;font-size:21px;margin-top:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input{background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:8px;padding:9px}
.search{min-width:220px;flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid #333;padding:7px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#181818;z-index:2}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid #333;border-radius:12px}
.tag{display:inline-block;border-radius:999px;padding:3px 6px;background:#292929;margin:2px;font-size:11px}
pre{white-space:pre-wrap;background:#0a0a0a;padding:12px;border-radius:10px;overflow:auto}

.ad-green{border-left:5px solid #55c26a}
.ad-yellow{border-left:5px solid #e4b84f}
.ad-red{border-left:5px solid #e35d5d}
.adbadge{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:700;font-size:12px}
.adbadge.green{background:#173c20;color:#8fd18f}
.adbadge.yellow{background:#463a17;color:#ffd27f}
.adbadge.red{background:#431b1b;color:#ff8b8b}

.ad-selected{outline:2px solid #8fd18f;box-shadow:0 0 0 3px rgba(143,209,143,.12)}
.editor-nav{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.editor-current{background:#151f17;border:1px solid #365c3c;border-radius:10px;padding:10px;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>PrimeTac Prom AI <span class="muted">v4</span></h1>
<div class="muted">Панель прибыли: Prom + Militaris + AI + продажи</div>

<div class="bar">
<button onclick="health()">Проверить подключение</button>
<button onclick="refreshMilitaris()">Обновить Militaris</button>
<button onclick="loadAll()">Анализ всего каталога</button>
<button onclick="showTop()">ТОП для продаж</button>
<button onclick="showPrices()">Цены</button>
<button onclick="loadSales()">Продажи</button>
<button onclick="loadOrders()">Заказы</button><button onclick="openEditor()">AI-редактор</button><button onclick="loadAdCandidates()">ТОП-30 для рекламы</button>
</div>

<div id="status" class="card">Проверяем...</div>
<div id="stats" class="stats"></div>

<div class="card">
<div class="row">
<input class="search" id="q" placeholder="Поиск товара..." oninput="render()">
<select id="filter" onchange="render()">
<option value="all">Все</option>
<option value="matched">Сопоставленные</option>
<option value="unmatched">Без сопоставления</option>
<option value="approx">Нужно проверить match</option>
<option value="margin20">Маржа ≥20%</option>
<option value="low">Маржа <10%</option>
<option value="loss">Убыток</option>
<option value="salomon">Salomon</option>
<option value="helikon">Helikon-Tex</option>
<option value="lowa">LOWA</option>
<option value="raise">Поднять цену</option>
<option value="keep">Оставить цену</option>
<option value="test_lower">Можно снизить</option>
</select>
<select id="sort" onchange="render()">
<option value="margin">Маржа ↓</option>
<option value="profit">Прибыль ↓</option>
<option value="price">Цена ↓</option>
<option value="name">Название A→Я</option>
</select>
</div>
<div class="muted small" style="margin-top:8px">
v7.1: удобный ТОП-30 + рынок Prom + безопасный AI основаны на закупке и марже. Это не анализ цен конкурентов.
</div>
</div>

<div id="content"></div>
</div>
<script>
const $=s=>document.querySelector(s); let REPORT=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function j(url,opts={}){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw new Error(d.error||"Ошибка");return d;}
function money(v){return v==null?"—":Math.round(Number(v)).toLocaleString("uk-UA")+" грн";}

async function health(){
 try{
  const d=await j("/api/health");
  $("#status").innerHTML=`Prom: <b class="${d.promConfigured?'good':'bad'}">${d.promConfigured?'подключён':'нет токена'}</b> · AI: <b class="${d.aiConfigured?'good':'bad'}">${d.aiConfigured?'подключён':'нет ключа'}</b> · Militaris: <b class="${d.militaris.count?'good':'warn'}">${d.militaris.count?d.militaris.count+' товаров':'не загружен'}</b>`;
 }catch(e){$("#status").textContent=e.message}
}
async function refreshMilitaris(){
 $("#status").textContent="Обновляю Militaris…";
 try{const d=await j("/api/militaris/refresh",{method:"POST"});$("#status").innerHTML=`Militaris: <b class="good">${d.count}</b> товаров.`}
 catch(e){$("#status").innerHTML=`<span class="bad">${esc(e.message)}</span>`}
}
function stats(s){
 $("#stats").innerHTML=`
 <div class="stat"><span class="muted">Товаров Prom</span><b>${s.total}</b></div>
 <div class="stat"><span class="muted">Надёжно сопоставлено</span><b class="good">${s.matched}</b></div>
 <div class="stat"><span class="muted">Без match</span><b class="warn">${s.unmatched}</b></div>
 <div class="stat"><span class="muted">Маржа ≥20%</span><b class="good">${s.highMargin}</b></div>
 <div class="stat"><span class="muted">Маржа <10%</span><b class="warn">${s.lowMargin}</b></div>
 <div class="stat"><span class="muted">Убыток</span><b class="bad">${s.loss}</b></div>
 <div class="stat"><span class="muted">Проверить match</span><b class="warn">${s.approximateMatches}</b></div>
 <div class="stat"><span class="muted">Условная прибыль*</span><b>${money(s.oneUnitGross)}</b></div>
 <div class="stat"><span class="muted">Поднять цену</span><b class="warn">${s.raisePrice||0}</b></div>
 <div class="stat"><span class="muted">Оставить</span><b class="good">${s.keepPrice||0}</b></div>
 <div class="stat"><span class="muted">Можно тестировать ниже</span><b>${s.testLower||0}</b></div>`;
}
async function loadAll(){
 $("#content").innerHTML='<div class="card">Загрузка и строгая проверка совпадений…</div>';
 try{
  const d=await j("/api/catalog/report-all");
  REPORT=d.report||[]; stats(d.summary); render();
 }catch(e){$("#content").innerHTML=`<div class="card bad">${esc(e.message)}</div>`}
}
function render(){
 let rows=[...REPORT];
 const q=$("#q").value.trim().toLowerCase();
 if(q) rows=rows.filter(x=>(x.product.name||"").toLowerCase().includes(q)||String(x.product.id||"").includes(q));

 const f=$("#filter").value;
 if(f==="matched") rows=rows.filter(x=>x.matched);
 if(f==="unmatched") rows=rows.filter(x=>!x.matched);
 if(f==="approx") rows=rows.filter(x=>x.matchMethod==="name_strong");
 if(f==="margin20") rows=rows.filter(x=>(x.marginPct??-999)>=20);
 if(f==="low") rows=rows.filter(x=>x.matched && (x.marginPct??999)<10);
 if(f==="loss") rows=rows.filter(x=>x.matched && (x.grossProfit??1)<=0);
 if(f==="salomon") rows=rows.filter(x=>x.discountGroup==="Salomon");
 if(f==="helikon") rows=rows.filter(x=>x.discountGroup==="Helikon-Tex");
 if(f==="lowa") rows=rows.filter(x=>x.discountGroup==="LOWA");
 if(["raise","keep","test_lower"].includes(f)) rows=rows.filter(x=>x.decision===f);

 const s=$("#sort").value;
 rows.sort((a,b)=>{
   if(s==="profit") return (b.grossProfit??-999999)-(a.grossProfit??-999999);
   if(s==="price") return Number(b.promPrice||0)-Number(a.promPrice||0);
   if(s==="name") return String(a.product.name||"").localeCompare(String(b.product.name||""),"uk");
   return (b.marginPct??-999)-(a.marginPct??-999);
 });

 if(!rows.length){$("#content").innerHTML='<div class="card">По фильтру ничего нет.</div>';return;}
 $("#content").innerHTML=`<div class="tablewrap"><table>
 <thead><tr><th>Товар</th><th>Prom</th><th>Militaris</th><th>Закупка</th><th>Прибыль</th><th>Маржа</th><th>Рекомендация</th><th>Рекоменд.20%</th><th>Score</th><th>Match</th><th>AI</th></tr></thead>
 <tbody>${rows.map(x=>{
   const idx=REPORT.indexOf(x);
   const cls=(x.marginPct??-999)>=20?'good':((x.grossProfit??0)>0?'warn':'bad');
   return `<tr>
   <td><b>${esc(x.product.name)}</b><br><span class="muted small">ID ${esc(x.product.id)}</span></td>
   <td>${money(x.promPrice)}</td>
   <td>${x.matched?`${money(x.supplierPrice)}<br><span class="muted small">${esc(x.supplierName||"")}</span>`:'—'}</td>
   <td>${money(x.buyPrice)}${x.discountPct!=null?`<br><span class="muted small">−${x.discountPct}% ${esc(x.discountGroup||"")}</span>`:''}</td>
   <td class="${cls}">${money(x.grossProfit)}</td>
   <td class="${cls}">${x.marginPct==null?'—':x.marginPct+'%'}</td>
   <td>${esc(x.label||"—")}</td><td>${money(x.recommended20)}</td><td>${x.score??0}</td>
   <td>${x.matched?`<span class="tag">${esc(x.matchMethod)}</span> <span class="tag">${esc(x.matchConfidence)}</span>`:'<span class="tag">нет</span>'}${(x.flags||[]).map(v=>`<div class="small warn">${esc(v)}</div>`).join("")}</td>
   <td><button onclick="ai(${idx})">AI</button></td>
   </tr><tr id="airow${idx}" style="display:none"><td colspan="11"><pre id="ai${idx}"></pre></td></tr>`;
 }).join("")}</tbody></table></div>`;
}
async function ai(i){
 const row=document.getElementById("airow"+i),box=document.getElementById("ai"+i);
 row.style.display="table-row"; box.textContent="Анализ…";
 try{const d=await j("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(REPORT[i])});box.textContent=d.text}
 catch(e){box.textContent=e.message}
}
function showTop(){
 const rows=[...REPORT].filter(x=>x.matched).sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,30);
 if(!rows.length){loadAll();return;}
 $("#content").innerHTML=`<div class="card"><b>ТОП для продаж</b><div class="muted small">Рейтинг учитывает маржу, прибыль и надёжность match. Спрос рынка пока не учитывается.</div></div>`+rows.map((x,i)=>`<div class="card"><b>${i+1}. ${esc(x.product.name)}</b><div class="row"><span class="tag">Score ${x.score}</span><span class="tag">Маржа ${x.marginPct}%</span><span class="tag">Прибыль ${money(x.grossProfit)}</span><span class="tag">${esc(x.label)}</span></div><div class="muted small">Prom ${money(x.promPrice)} · закупка ${money(x.buyPrice)} · техническая цена 20% ${money(x.recommended20)}</div></div>`).join("");
}
function showPrices(){
 const groups=[['raise','Поднять цену'],['keep','Оставить цену'],['test_lower','Можно тестировать снижение']];
 $("#content").innerHTML=groups.map(([k,t])=>{const a=REPORT.filter(x=>x.decision===k);return `<div class="card"><b>${t}: ${a.length}</b>${a.slice(0,25).map(x=>`<div style="padding:7px 0;border-bottom:1px solid #333"><b>${esc(x.product.name)}</b><br><span class="muted small">Сейчас ${money(x.promPrice)} · закупка ${money(x.buyPrice)} · 20% ${money(x.recommended20)} · маржа ${x.marginPct}%</span></div>`).join('')}</div>`}).join('');
}
async function loadSales(){
 $("#content").innerHTML='<div class="card">Получаю последние заказы Prom… В v4.1 каталог повторно не пересчитывается.</div>';
 try{
  const d=await j('/api/orders/analytics');
  $("#content").innerHTML=`<div class="stats">
    <div class="stat"><span class="muted">Заказов</span><b>${d.orders}</b></div>
    <div class="stat"><span class="muted">С товарными строками</span><b>${d.ordersWithItems??0}</b></div>
    <div class="stat"><span class="muted">Единиц</span><b>${d.units}</b></div>
    <div class="stat"><span class="muted">Оборот</span><b>${money(d.revenue)}</b></div>
    <div class="stat"><span class="muted">Расчётная валовая прибыль</span><b class="good">${money(d.estimatedGross)}</b></div>
  </div>
  <div class="card">
    <b>Продажи по последним заказам</b>
    <div class="muted small">${esc(d.note||'')}</div>
    <div class="muted small" style="margin-top:4px">Сопоставлено единиц: ${d.matchedUnits??0} из ${d.units??0}.</div>
  </div>
  <div class="card"><b>Товары в заказах</b>
  ${(d.top||[]).length ? (d.top||[]).map(x=>`<div style="padding:8px 0;border-bottom:1px solid #333"><b>${esc(x.name)}</b><br><span class="muted small">${x.qty} шт. · оборот ${money(x.revenue)} · расчётная прибыль ${money(x.estimatedGross)} ${x.matched?'':'· нет match'}</span></div>`).join('') : '<div class="muted">В последних заказах товарные строки не найдены или заказов пока нет.</div>'}
  </div>`;
 }catch(e){
  $("#content").innerHTML=`<div class="card bad"><b>Ошибка продаж</b><br>${esc(e.message)}</div>`;
 }
}
async function loadOrders(){
 $("#content").innerHTML='<div class="card">Загрузка заказов…</div>';
 try{
  const d=await j("/api/orders"); const a=Array.isArray(d.orders)?d.orders:[];
  $("#content").innerHTML=a.length?a.slice(0,100).map(o=>`<div class="card"><b>Заказ #${esc(o.id)}</b><div class="muted">${esc(o.status||"")} · ${esc(o.full_price||o.price||"")}</div></div>`).join(""):'<div class="card">Заказов нет.</div>';
 }catch(e){$("#content").innerHTML=`<div class="card bad">${esc(e.message)}</div>`}
}

function editorProductOptions(selectedId=null){
 const sid=selectedId==null?"":String(selectedId);
 return REPORT.map(x=>{
   const id=String(x.product.id);
   const selected=id===sid?" selected":"";
   return `<option value="${esc(id)}"${selected}>${esc(x.product.name)} — ${money(x.promPrice)}</option>`;
 }).join("");
}

function currentAdCandidateIndex(productId){
 const list=window.AD_CANDIDATES||[];
 return list.findIndex(x=>String(x?.product?.id)===String(productId));
}

function editorNavHtml(selectedProductId){
 const list=window.AD_CANDIDATES||[];
 const idx=currentAdCandidateIndex(selectedProductId);
 if(idx<0) return "";
 const x=list[idx];
 return `<div class="editor-current">
   <b>ТОП-30: #${idx+1} из ${list.length}</b><br>
   <span class="muted small">${esc(x.product.name)}</span>
   <div class="editor-nav">
     <button onclick="openAdCandidateRelative(-1)" ${idx<=0?"disabled":""}>← Предыдущий</button>
     <button onclick="backToAdCandidates()">← Вернуться к ТОП-30</button>
     <button onclick="openAdCandidateRelative(1)" ${idx>=list.length-1?"disabled":""}>Следующий →</button>
   </div>
 </div>`;
}

function openEditor(selectedProductId=null){
 if(!REPORT.length){
   $("#content").innerHTML='<div class="card warn">Сначала нажми «Анализ всего каталога».</div>';
   return;
 }
 const selected=selectedProductId==null?null:String(selectedProductId);
 window._editorSelectedProductId=selected;
 $("#content").innerHTML=`${selected?editorNavHtml(selected):""}<div class="card">
   <h3 style="margin-top:0">AI-редактор товара</h3>
   <div class="muted small">Сначала AI только готовит изменения. Запись в Prom происходит отдельной кнопкой и требует WRITE_PIN.</div>
   <div style="margin-top:10px">
     <label>Товар</label><br>
     <select id="editProduct" style="width:100%">${editorProductOptions(selected)}</select>
   </div>
   <div class="row" style="margin-top:10px">
     <label><input id="editName" type="checkbox" checked> Название</label>
     <label><input id="editPrice" type="checkbox" checked> Цена</label>
     <label><input id="editDesc" type="checkbox" checked> Описание</label>
     <label>Целевая маржа <input id="editMargin" type="number" value="20" min="5" max="50" style="width:80px">%</label>
   </div>
   <button style="margin-top:10px" onclick="proposeEdit()">Подготовить изменения AI</button>
 </div><div id="editorResult"></div>`;

 const sel=document.getElementById("editProduct");
 if(sel){
   sel.addEventListener("change",()=>{
     window._editorSelectedProductId=sel.value;
     const idx=currentAdCandidateIndex(sel.value);
     if(idx>=0){
       const nav=document.querySelector(".editor-current");
       if(nav) nav.outerHTML=editorNavHtml(sel.value);
     }
   });
 }
}

async function proposeEdit(){
 const productId=$("#editProduct").value;
 $("#editorResult").innerHTML='<div class="card">AI готовит предложение…</div>';
 try{
  const d=await j("/api/editor/propose",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      productId,
      targetMargin:Number($("#editMargin").value||20),
      changePrice:$("#editPrice").checked,
      changeDescription:$("#editDesc").checked,
      changeName:$("#editName").checked
    })
  });
  window._editProposal=d;
  $("#editorResult").innerHTML=`<div class="card">
   <b>${esc(d.name)}</b>
   <div style="margin-top:10px"><b>Новое название</b></div>
   <input id="proposalName" style="width:100%" value="${esc(d.proposedName||d.currentName||"")}">
   <div class="row" style="margin-top:8px">
    <span class="tag">Текущая цена: ${money(d.currentPrice)}</span>
    <span class="tag">Закупка: ${money(d.buyPrice)}</span>
    <span class="tag" id="newPriceTag">Цена по марже: ${money(d.proposedPrice)}</span>
   </div>
   <div class="row" style="margin-top:10px">
     <label>Минимальная маржа <input id="marketMinMargin" type="number" value="12" min="5" max="40" style="width:70px">%</label>
     <button onclick="marketCheck()">Проверить рынок Prom</button>
   </div>
   <div id="marketResult"></div>
   <div style="margin-top:12px"><b>Новое описание</b></div>
   <textarea id="proposalDescription" style="width:100%;min-height:260px;background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:8px;padding:10px">${esc(d.proposedDescription||"")}</textarea>
   <div class="muted small">Можно вручную поправить текст перед записью.</div>
   <div style="margin-top:10px">
    <label>WRITE_PIN <input id="writePin" type="password" autocomplete="off"></label>
   </div>
   <button style="margin-top:10px" onclick="applyEdit()">ПРИМЕНИТЬ В PROM</button>
   <div class="muted small" style="margin-top:6px">Изменение будет реальным. Для первого теста выбери один недорогой товар.</div>
  </div>`;
 }catch(e){
  $("#editorResult").innerHTML=`<div class="card bad">${esc(e.message)}</div>`;
 }
}

async function marketCheck(){
 const d=window._editProposal;
 if(!d) return;
 const box=$("#marketResult");
 box.innerHTML='<div class="card">Ищу актуальные цены на Prom.ua…</div>';

 try{
   const r=await fetch("/api/market/check",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       productId:d.productId,
       minMargin:Number($("#marketMinMargin").value||12)
     })
   });
   const m=await r.json();
   if(!r.ok){
     const extra=[m.apiMessage,m.apiType,m.apiCode].filter(Boolean).join(" · ");
     throw new Error((m.error||"Ошибка поиска рынка") + (extra?` — ${extra}`:""));
   }

   window._marketResult=m;
   if(m.recommendedPrice!=null){
     d.proposedPrice=m.recommendedPrice;
     const tag=document.getElementById("newPriceTag");
     if(tag) tag.textContent=`Цена по рынку: ${money(m.recommendedPrice)}`;
   }

   const comps=(m.competitors||[]).map(c=>
     `<div style="padding:6px 0;border-bottom:1px solid #333">
       <b>${money(c.price)}</b> · ${esc(c.match)}
       <br><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title||c.url)}</a>
       ${c.reason?`<br><span class="muted small">${esc(c.reason)}</span>`:""}
     </div>`
   ).join("");

   const sources=(m.sources||[]).map(s=>
     `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`
   ).join("<br>");

   box.innerHTML=`<div class="card">
     <b>Рынок Prom</b>
     <div class="row" style="margin-top:8px">
       <span class="tag">Минимум рынка: ${money(m.marketLow)}</span>
       <span class="tag">Медиана: ${money(m.marketMedian)}</span>
       <span class="tag">Нижняя четверть: ${money(m.marketQ1)}</span>
       <span class="tag">Минимум по марже: ${money(m.floorPrice)}</span>
       <span class="tag">Рекомендовано: ${money(m.recommendedPrice)}</span>
       <span class="tag">Прибыль: ${money(m.expectedProfit)}</span>
       <span class="tag">Маржа: ${m.expectedMargin==null?"—":m.expectedMargin+"%"}</span>
     </div>
     ${m.adDecision?`<div class="card ad-${esc(m.adDecision.color)}"><span class="adbadge ${esc(m.adDecision.color)}">${esc(m.adDecision.label)}</span> <b>Score ${esc(m.adDecision.score)}</b><br><span class="muted small">${esc(m.adDecision.reason||"")}</span></div>`:""}
     <p><strong>${esc(m.status||"")}</strong></p>
     ${m.usedFallback?'<div class="warn small">Использован резервный web search без domain filter.</div>':''}
     <div class="muted small">${esc(m.comment||"")}</div>
     <div style="margin-top:10px"><b>Найденные предложения</b>${comps||'<div class="muted">Точных предложений не найдено.</div>'}</div>
     ${sources?`<div style="margin-top:10px"><b>Источники поиска</b><br>${sources}</div>`:""}
   </div>`;
 }catch(e){
   box.innerHTML=`<div class="card bad">${esc(e.message)}</div>`;
 }
}

async function applyEdit(){
 const d=window._editProposal;
 if(!d) return;
 const pin=$("#writePin").value;
 if(!pin){
   alert("Введи WRITE_PIN");
   return;
 }
 if(!confirm(`Реально изменить товар "${d.name}" в Prom?`)) return;

 const payload={
   productId:d.productId,
   confirm:"APPLY"
 };
 if(d.proposedPrice!=null) payload.price=d.proposedPrice;
 const newName=$("#proposalName")?.value?.trim();
 if(newName) payload.name=newName;
 const desc=$("#proposalDescription").value;
 if(desc.trim()) payload.description=desc;

 $("#editorResult").insertAdjacentHTML("beforeend",'<div id="applyStatus" class="card">Отправляю изменение в Prom…</div>');
 try{
   const r=await fetch("/api/editor/apply",{
     method:"POST",
     headers:{"Content-Type":"application/json","X-Write-Pin":pin},
     body:JSON.stringify(payload)
   });
   const out=await r.json();
   if(!r.ok) throw new Error(out.error + (out.details?` — ${JSON.stringify(out.details)}`:""));
   $("#applyStatus").innerHTML='<b class="good">Готово: Prom принял изменение.</b><br><span class="muted small">Теперь обнови каталог и проверь карточку на Prom.</span>';
 }catch(e){
   $("#applyStatus").innerHTML=`<b class="bad">Prom не принял изменение:</b><br>${esc(e.message)}<br><span class="muted small">Это безопасно: если API вернул ошибку, массовых изменений не делаем.</span>`;
 }
}

function renderAdCandidates(selectedId=null){
 const list=window.AD_CANDIDATES||[];
 const note=window.AD_CANDIDATES_NOTE||"";
 const rows=list.map((x,i)=>{
   const id=String(x.product.id);
   const selected=selectedId!=null && id===String(selectedId);
   return `<div id="ad-candidate-${esc(id)}" class="card ${selected?"ad-selected":""}">
       <b>${i+1}. ${esc(x.product.name)}</b>
       <div class="row" style="margin-top:6px">
         <span class="tag">Pre-score ${esc(x.preScore)}</span>
         <span class="tag">Цена ${money(x.promPrice)}</span>
         <span class="tag">Закупка ${money(x.buyPrice)}</span>
         <span class="tag">Прибыль ${money(x.grossProfit)}</span>
         <span class="tag">Маржа ${x.marginPct==null?"—":x.marginPct+"%"}</span>
       </div>
       <div class="muted small" style="margin-top:6px">Это предварительный рейтинг. Для финального решения нажми «Проверить рынок Prom» в AI-редакторе.</div>
       <button style="margin-top:8px" onclick="openEditorFor('${esc(id)}')">Редактировать именно этот товар</button>
     </div>`;
 }).join("");

 $("#content").innerHTML=`<div class="card">
   <b>ТОП-30 кандидатов на рекламу</b>
   <div class="muted small">${esc(note)}</div>
   ${selectedId?`<div class="good small" style="margin-top:6px">Подсвечен товар, который ты только что редактировал.</div>`:""}
 </div>${rows}`;

 if(selectedId!=null){
   setTimeout(()=>{
     const el=document.getElementById(`ad-candidate-${String(selectedId)}`);
     if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
   },60);
 }
}

async function loadAdCandidates(){
 $("#content").innerHTML='<div class="card">Формирую предварительный ТОП-30 по марже, прибыли и надёжности match…</div>';
 try{
   const d=await j("/api/ads/candidates?limit=30");
   window.AD_CANDIDATES=d.items||[];
   window.AD_CANDIDATES_NOTE=d.note||"";
   renderAdCandidates();
 }catch(e){
   $("#content").innerHTML=`<div class="card bad">${esc(e.message)}</div>`;
 }
}

function openEditorFor(productId){
 window._lastAdCandidateId=String(productId);
 openEditor(String(productId));
 setTimeout(()=>{
   const sel=document.getElementById("editProduct");
   if(sel){
     sel.value=String(productId);
     sel.scrollIntoView({behavior:"smooth",block:"center"});
   }
 },40);
}

function backToAdCandidates(){
 const id=window._editorSelectedProductId || window._lastAdCandidateId || null;
 renderAdCandidates(id);
}

function openAdCandidateRelative(delta){
 const list=window.AD_CANDIDATES||[];
 const current=window._editorSelectedProductId || window._lastAdCandidateId;
 const idx=currentAdCandidateIndex(current);
 if(idx<0) return;
 const next=Math.max(0,Math.min(list.length-1,idx+delta));
 const id=String(list[next].product.id);
 window._lastAdCandidateId=id;
 openEditor(id);
}

health();
</script>

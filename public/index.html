<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrimeTac Prom AI v7.1</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#111;color:#eee}
.wrap{max-width:1250px;margin:auto;padding:14px}
h1{font-size:24px;margin:0 0 5px}.muted{color:#aaa}.small{font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}
.card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:13px;margin:10px 0}
.good{color:#8fd18f}.warn{color:#ffd27f}.bad{color:#ff8b8b}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}
.stat{background:#161616;border:1px solid #303030;border-radius:12px;padding:10px}
.stat b{display:block;font-size:21px;margin-top:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input{background:#0f0f0f;color:#fff;border:1px solid #444;border-radius:8px;padding:9px}
.search{min-width:220px;flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid #333;padding:7px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:#181818;z-index:2}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid #333;border-radius:12px}
.tag{display:inline-block;border-radius:999px;padding:3px 6px;background:#292929;margin:2px;font-size:11px}
pre{white-space:pre-wrap;background:#0a0a0a;padding:12px;border-radius:10px;overflow:auto}

.ad-green{border-left:5px solid #55c26a}
.ad-yellow{border-left:5px solid #e4b84f}
.ad-red{border-left:5px solid #e35d5d}
.adbadge{display:inline-block;padding:4px 8px;border-radius:999px;font-weight:700;font-size:12px}
.adbadge.green{background:#173c20;color:#8fd18f}
.adbadge.yellow{background:#463a17;color:#ffd27f}
.adbadge.red{background:#431b1b;color:#ff8b8b}

.ad-selected{outline:2px solid #8fd18f;box-shadow:0 0 0 3px rgba(143,209,143,.12)}
.editor-nav{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.editor-current{background:#151f17;border:1px solid #365c3c;border-radius:10px;padding:10px;margin:8px 0}

.autopilot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:10px 0}
.auto-log{max-height:420px;overflow:auto;background:#0b0b0b;border:1px solid #333;border-radius:10px;padding:10px;font-size:12px}
.auto-row{padding:6px 0;border-bottom:1px solid #252525}
.auto-ok{color:#8fd18f}.auto-skip{color:#ffd27f}.auto-err{color:#ff8b8b}
.policy-table{width:100%;border-collapse:collapse}.policy-table td,.policy-table th{padding:6px;border-bottom:1px solid #333}

.markup20-box{border:1px solid #4e6b53;border-radius:12px;padding:12px;margin:10px 0}
.markup20-progress{height:9px;background:#222;border-radius:999px;overflow:hidden;margin:8px 0}
.markup20-progress>div{height:100%;background:#8fd18f;width:0%}
</style>
</head>
<body>
<div class="wrap">
<h1>PrimeTac Prom AI <span class="muted">v8</span></h1>
<div class="muted">Панель прибыли: Prom + Militaris + AI + продажи</div>

<div class="bar">
<button onclick="health()">Проверить подключение</button>
<button onclick="refreshMilitaris()">Обновить Militaris</button>
<button onclick="loadAll()">Анализ всего каталога</button>
<button onclick="showTop()">ТОП для продаж</button>
<button onclick="showPrices()">Цены</button>
<button onclick="loadSales()">Продажи</button>
<button onclick="loadOrders()">Заказы</button><button onclick="openEditor()">AI-редактор</button><button onclick="loadAdCandidates()">ТОП-30 для рекламы</button><button onclick="openAutopilot()">⚡ АВТО-РЕДАКТОР</button><button onclick="openMarkup20()">💰 УРАВНЯТЬ +20%</button>
</div>

<div id="status" class="card">Проверяем...</div>
<div id="stats" class="stats"></div>

<div class="card">
<div class="row">
<input class="search" id="q" placeholder="Поиск товара..." oninput="render()">
<select id="filter" onchange="render()">
<option value="all">Все</option>
<option value="matched">Сопоставленные</option>
<option value="unmatched">Без сопоставления</option>
<option value="approx">Нужно проверить match</option>
<option value="margin20">Чистая маржа ≥20%</option>
<option value="low">Чистая маржа <20%</option>
<option value="loss">Убыток</option>
<option value="salomon">Salomon</option>
<option value="helikon">Helikon-Tex</option>
<option value="lowa">LOWA</option>
<option value="raise">Поднять цену</option>
<option value="keep">Оставить цену</option>
<option value="test_lower">Можно снизить</option>
</select>
<select id="sort" onchange="render()">
<option value="margin">Чистая маржа ↓</option>
<option value="profit">Прибыль ↓</option>
<option value="price">Цена ↓</option>
<option value="name">Название A→Я</option>
</select>
</div>
<div class="muted small" style="margin-top:8px">
v8: автопилот + динамическая маржа по скидке Militaris + рынок Prom основаны на закупке и марже. Это не анализ цен конкурентов.
</div>
</div>

<div id="content"></div>
</div>
<script>
const $=s=>document.querySelector(s); let REPORT=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function j(url,opts={}){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw new Error(d.error||"Ошибка");return d;}
function money(v){return v==null?"—":Math.round(Number(v)).toLocaleString("uk-UA")+" грн";}

async function health(){
 try{
  const d=await j("/api/health");
  $("#status").innerHTML=`Prom: <b class="${d.promConfigured?'good':'bad'}">${d.promConfigured?'подключён':'нет токена'}</b> · AI: <b class="${d.aiConfigured?'good':'bad'}">${d.aiConfigured?'подключён':'нет ключа'}</b> · Militaris: <b class="${d.militaris.count?'good':'warn'}">${d.militaris.count?d.militaris.count+' товаров':'не загружен'}</b> · Комиссии Econom: <b class="${d.commissions?.count?'good':'warn'}">${d.commissions?.count?d.commissions.count+' категорий':'fallback '+(d.commissions?.fallbackPct||12.5)+'%'}</b> · Цель: <b class="good">${d.commissions?.targetNetMarginPct||20}% чистыми</b>`;
 }catch(e){$("#status").textContent=e.message}
}
async function refreshMilitaris(){
 $("#status").textContent="Обновляю Militaris…";
 try{const d=await j("/api/militaris/refresh",{method:"POST"});$("#status").innerHTML=`Militaris: <b class="good">${d.count}</b> товаров.`}
 catch(e){$("#status").innerHTML=`<span class="bad">${esc(e.message)}</span>`}
}
function stats(s){
 $("#stats").innerHTML=`
 <div class="stat"><span class="muted">Товаров Prom</span><b>${s.total}</b></div>
 <div class="stat"><span class="muted">Надёжно сопоставлено</span><b class="good">${s.matched}</b></div>
 <div class="stat"><span class="muted">Без match</span><b class="warn">${s.unmatched}</b></div>
 <div class="stat"><span class="muted">Чистая маржа ≥20%</span><b class="good">${s.highMargin}</b></div>
 <div class="stat"><span class="muted">Маржа <10%</span><b class="warn">${s.lowMargin}</b></div>
 <div class="stat"><span class="muted">Убыток</span><b class="bad">${s.loss}</b></div>
 <div class="stat"><span class="muted">Проверить match</span><b class="warn">${s.approximateMatches}</b></div>
 <div class="stat"><span class="muted">Условная чистая прибыль*</span><b>${money(s.oneUnitGross)}</b></div>
 <div class="stat"><span class="muted">Поднять цену</span><b class="warn">${s.raisePrice||0}</b></div>
 <div class="stat"><span class="muted">Оставить</span><b class="good">${s.keepPrice||0}</b></div>
 <div class="stat"><span class="muted">Можно тестировать ниже</span><b>${s.testLower||0}</b></div>`;
}
async function loadAll(){
 $("#content").innerHTML='<div class="card">Загрузка и строгая проверка совпадений…</div>';
 try{
  const d=await j("/api/catalog/report-all");
  REPORT=d.report||[]; stats(d.summary); render();
 }catch(e){$("#content").innerHTML=`<div class="card bad">${esc(e.message)}</div>`}
}
function render(){
 let rows=[...REPORT];
 const q=$("#q").value.trim().toLowerCase();
 if(q) rows=rows.filter(x=>(x.product.name||"").toLowerCase().includes(q)||String(x.product.id||"").includes(q));

 const f=$("#filter").value;
 if(f==="matched") rows=rows.filter(x=>x.matched);
 if(f==="unmatched") rows=rows.filter(x=>!x.matched);
 if(f==="approx") rows=rows.filter(x=>x.matchMethod==="name_strong");
 if(f==="margin20") rows=rows.filter(x=>(x.netMarginPct??-999)>=20);
 if(f==="low") rows=rows.filter(x=>x.matched && (x.netMarginPct??999)<20);
 if(f==="loss") rows=rows.filter(x=>x.matched && (x.netProfit??1)<=0);
 if(f==="salomon") rows=rows.filter(x=>x.discountGroup==="Salomon");
 if(f==="helikon") rows=rows.filter(x=>x.discountGroup==="Helikon-Tex");
 if(f==="lowa") rows=rows.filter(x=>x.discountGroup==="LOWA");
 if(["raise","keep","test_lower"].includes(f)) rows=rows.filter(x=>x.decision===f);

 const s=$("#sort").value;
 rows.sort((a,b)=>{
   if(s==="profit") return (b.netProfit??-999999)-(a.netProfit??-999999);
   if(s==="price") return Number(b.promPrice||0)-Number(a.promPrice||0);
   if(s==="name") return String(a.product.name||"").localeCompare(String(b.product.name||""),"uk");
   return (b.netMarginPct??-999)-(a.netMarginPct??-999);
 });

 if(!rows.length){$("#content").innerHTML='<div class="card">По фильтру ничего нет.</div>';return;}
 $("#content").innerHTML=`<div class="tablewrap"><table>
 <thead><tr><th>Товар</th><th>Prom</th><th>Militaris</th><th>Закупка</th><th>Econom</th><th>Чистая прибыль</th><th>Чистая маржа</th><th>Рекомендация</th><th>Мин. цена 20%</th><th>Score</th><th>Match</th><th>AI</th></tr></thead>
 <tbody>${rows.map(x=>{
   const idx=REPORT.indexOf(x);
   const cls=(x.netMarginPct??-999)>=20?'good':((x.netProfit??0)>0?'warn':'bad');
   return `<tr>
   <td><b>${esc(x.product.name)}</b><br><span class="muted small">ID ${esc(x.product.id)}</span></td>
   <td>${money(x.promPrice)}</td>
   <td>${x.matched?`${money(x.supplierPrice)}<br><span class="muted small">${esc(x.supplierName||"")}</span>`:'—'}</td>
   <td>${money(x.buyPrice)}${x.discountPct!=null?`<br><span class="muted small">−${x.discountPct}% ${esc(x.discountGroup||"")}</span>`:''}</td>
   <td>${x.economCommissionPct==null?'—':x.economCommissionPct+'%'}<br><span class="muted small">${money(x.commissionCost)} · ${esc(x.commissionSource||"")}</span></td>
   <td class="${cls}">${money(x.netProfit)}</td>
   <td class="${cls}">${x.netMarginPct==null?'—':x.netMarginPct+'%'}</td>
   <td>${esc(x.label||"—")}</td><td>${money(x.recommendedNet20||x.recommended20)}</td><td>${x.score??0}</td>
   <td>${x.matched?`<span class="tag">${esc(x.matchMethod)}</span> <span class="tag">${esc(x.matchConfidence)}</span>`:'<span class="tag">нет</span>'}${(x.flags||[]).map(v=>`<div class="small warn">${esc(v)}</div>`).join("")}</td>
   <td><button onclick="ai(${idx})">AI</button></td>
   </tr><tr id="airow${idx}" style="display:none"><td colspan="12"><pre id="ai${idx}"></pre></td></tr>`;
 }).join("")}</tbody></table></div>`;
}
async function ai(i){
 const row=document.getElementById("airow"+i),box=document.getElementById("ai"+i);
 row.style.display="table-row"; box.textContent="Анализ…";
 try{const d=await j("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(REPORT[i])});box.textContent=d.text}
 catch(e){box.textContent=e.message}
}
function showTop(){
 const rows=[...REPORT].filter(x=>x.matched).sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,30);
 if(!rows.length){loadAll();return;}
 $("#content").innerHTML=`<div class="card"><b>ТОП для продаж</b><div class="muted small">Рейтинг учитывает маржу, прибыль и надёжность match. Спрос рынка пока не учитывается.</div></div>`+rows.map((x,i)=>`<div class="card"><b>${i+1}. ${esc(x.product.name)}</b><div class="row"><span class="tag">Score ${x.score}</span><span class="tag">Чистая маржа ${x.netMarginPct}%</span><span class="tag">Чистая прибыль ${money(x.netProfit)}</span><span class="tag">${esc(x.label)}</span></div><div class="muted small">Prom ${money(x.promPrice)} · закупка ${money(x.buyPrice)} · минимум 20% чистыми ${money(x.recommendedNet20||x.recommended20)}</div></div>`).join("");
}
function showPrices(){
 const groups=[['raise','Поднять цену'],['keep','Оставить цену'],['test_lower','Можно тестировать снижение']];
 $("#content").innerHTML=groups.map(([k,t])=>{const a=REPORT.filter(x=>x.decision===k);return `<div class="card"><b>${t}: ${a.length}</b>${a.slice(0,25).map(x=>`<div style="padding:7px 0;border-bottom:1px solid #333"><b>${esc(x.product.name)}</b><br><span class="muted small">Сейчас ${money(x.promPrice)} · закупка ${money(x.buyPrice)} · минимум 20% ${money(x.recommendedNet20||x.recommended20)} · чистая маржа ${x.netMarginPct}%</span></div>`).join('')}</div>`}).join('');
}
async function loadSales(){
 $("#content").innerHTML='<div class="card">Получаю последние заказы Prom… В v4.1 каталог повторно не пересчитывается.</div>';
 try{
  const d=await j('/api/orders/analytics');
  $("#content").innerHTML=`<div class="stats">
    <div class="stat"><span class="muted">Заказов</span><b>${d.orders}</b></div>
    <div class="stat"><span class="muted">С товарными строками</span><b>${d.ordersWithItems??0}</b></div>
    <div class="stat"><span class="muted">Единиц</span><b>${d.units}</b></div>
    <div class="stat"><span class="muted">Оборот</span><b>${money(d.revenue)}</b></div>
    <div class="stat"><span class="muted">Расчётная валовая прибыль</span><b class="good">${money(d.estimatedGross)}</b></div>
  </div>
  <div class="card">
    <b>Продажи по последним заказам</b>
    <div class="muted small">${esc(d.note||'')}</div>
    <div class="muted small" style="margin-top:4px">Сопоставлено единиц: ${d.matchedUnits??0} из ${d.units??0}.</div>
  </div>
  <div class="card"><b>Товары в заказах</b>
  ${(d.top||[]).length ? (d.top||[]).map(x=>`<div style="padding:8px 0;border-bottom:1px solid #333"><b>${esc(x.name)}</b><br><span class="muted small">${x.qty} шт. · оборот ${money(x.revenue)} · расчётная прибыль ${money(x.estimatedGross)} ${x.matched?'':'· нет match'}</span></div>`).join('') : '<div class="muted">В последних заказах товарные строки не найдены или заказов пока нет.</div>'}
  </div>`;
 }catch(e){
  $("#content").innerHTML=`<div class="card bad"><b>Ошибка продаж</b><br>${esc(e.message)}</div>`;
 }
}
async function loadOrders(){
 $("#content").innerHTML='<div class="card">Загрузка заказов…</div>';
 try{
  const d=await j("/api/orders"); const a=Array.isArray(d.orders)?d.orders:[];
  $("#content").innerHTML=a.length?a.slice(0,100).map(o=>`<div class="card"><b>Заказ #${esc(o.id)}</b><div class="muted">${esc(o.status||"")} · ${esc(o.full_price||o.price||"")}</div></div>`).join(""):'<div class="card">Заказов нет.</div>';
 }catch(e){$("#content").innerHTML=`<div class="card bad">${esc(e.message)}</div>`}
}

function editorProductOptions(selectedId=null){
 const sid=selectedId==null?"":String(selectedId);
 return REPORT.map(x=>{
   const id=String(x.product.id);
   const selected=id===sid?" selected":"";
   return `<option value="${esc(id)}"${selected}>${esc(x.product.name)} — ${money(x.promPrice)}</option>`;
 }).join("");
}

function currentAdCandidateIndex(productId){
 const list=window.AD_CANDIDATES||[];
 return list.findIndex(x=>String(x?.product?.id)===String(productId));
}

function editorNavHtml(selectedProductId){
 const list=window.AD_CANDIDATES||[];
 const idx=currentAdCandidateIndex(selectedProductId);
 if(idx<0) return "";
 const x=list[idx];
 return `<div class="editor-current">
   <b>ТОП-30: #${idx+1} из ${list.length}</b><br>
   <span class="muted small">${esc(x.product.name)}</span>
   <div class="editor-nav">
     <button onclick="openAdCandidateRelative(-1)" ${idx<=0?"disabled":""}>← Предыдущий</button>
     <button onclick="backToAdCandidates()">← Вернуться к ТОП-30</button>
     <button onclick="openAdCandidateRelative(1)" ${idx>=list.length-1?"disabled":""}>Следующий →</button>
   </div>
 </div>`;
}

function productPolicy(x){
 const target=20;
 const min=20;
 return {
   target,
   min,
   discount:Number(x?.discountPct||0),
   group:x?.discountGroup||"—",
   commission:Number(x?.economCommissionPct||12.5),
   safePrice:Number(x?.recommendedNet20||x?.recommended20||0)
 };
}

function selectedReportItem(productId){
 return REPORT.find(x=>String(x?.product?.id)===String(productId))||null;
}

function syncEditorPolicy(){
 const sel=document.getElementById("editProduct");
 if(!sel) return;
 const x=selectedReportItem(sel.value);
 const p=productPolicy(x);
 const m=document.getElementById("editMargin");
 if(m) m.value=p.target;
 const d=document.getElementById("editorDiscount");
 if(d) d.textContent=`${p.group}: скидка Militaris ${p.discount}% · Econom ${p.commission}% · цель ${p.target}% чистой маржи`;
}

function openEditor(selectedProductId=null){
 if(!REPORT.length){
   $("#content").innerHTML='<div class="card warn">Сначала нажми «Анализ всего каталога».</div>';
   return;
 }
 const selected=selectedProductId==null?null:String(selectedProductId);
 window._editorSelectedProductId=selected;
 $("#content").innerHTML=`${selected?editorNavHtml(selected):""}<div class="card">
   <h3 style="margin-top:0">AI-редактор товара</h3>
   <div class="muted small">Сначала AI только готовит изменения. Запись в Prom происходит отдельной кнопкой и требует WRITE_PIN.</div>
   <div style="margin-top:10px">
     <label>Товар</label><br>
     <select id="editProduct" style="width:100%">${editorProductOptions(selected)}</select>
   </div>
   <div class="row" style="margin-top:10px">
     <label><input id="editName" type="checkbox" checked> Название</label>
     <label><input id="editPrice" type="checkbox" checked> Цена</label>
     <label><input id="editDesc" type="checkbox" checked> Описание</label>
     <label>Автоцель маржи <input id="editMargin" type="number" value="15" min="3" max="50" style="width:80px" readonly>%</label>
   </div>
   <div id="editorDiscount" class="muted small" style="margin-top:6px">Цель фиксирована: минимум 20% чистой маржи после комиссии Prom Econom.</div>
   <button style="margin-top:10px" onclick="proposeEdit()">Подготовить изменения AI</button>
 </div><div id="editorResult"></div>`;

 const sel=document.getElementById("editProduct");
 if(sel){
   sel.addEventListener("change",()=>{
     window._editorSelectedProductId=sel.value;
     syncEditorPolicy();
     const idx=currentAdCandidateIndex(sel.value);
     if(idx>=0){
       const nav=document.querySelector(".editor-current");
       if(nav) nav.outerHTML=editorNavHtml(sel.value);
     }
   });
 }
 syncEditorPolicy();
}

async function proposeEdit(){
 const productId=$("#editProduct").value;
 $("#editorResult").innerHTML='<div class="card">AI готовит предложение…</div>';
 try{
  const d=await j("/api/editor/propose",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      productId,
      targetMargin:Number($("#editMargin").value||20),
      changePrice:$("#editPrice").checked,
      changeDescription:$("#editDesc").checked,
      changeName:$("#editName").checked
    })
  });
  window._editProposal=d;
  $("#editorResult").innerHTML=`<div class="card">
   <b>${esc(d.name)}</b>
   <div style="margin-top:10px"><b>Новое название</b></div>
   <input id="proposalName" style="width:100%" value="${esc(d.proposedName||d.currentName||"")}">
   <div class="row" style="margin-top:8px">
    <span class="tag">Текущая цена: ${money(d.currentPrice)}</span>
    <span class="tag">Закупка: ${money(d.buyPrice)}</span><span class="tag">Econom: ${d.economCommissionPct??"—"}%</span>
    <span class="tag">Скидка Militaris: ${esc(d.discountPct)}% ${esc(d.discountGroup||"")}</span>
    <span class="tag">Автоцель: ${esc(d.targetMargin)}%</span>
    <span class="tag" id="newPriceTag">Цена по марже: ${money(d.proposedPrice)}</span>
   </div>
   <div class="row" style="margin-top:10px">
     <label>Минимальная чистая маржа <input id="marketMinMargin" type="number" value="20" min="20" max="40" style="width:70px">%</label>
     <button onclick="marketCheck()">Проверить рынок Prom</button>
   </div>
   <div id="marketResult"></div>
   <div style="margin-top:12px"><b>Новое описание</b></div>

}

function plainLen(s){ return String(s||"").replace(/<[^>]+>/g," ").replace(/&[a-z#0-9]+;/gi," ").replace(/\s+/g," ").trim().length; }

function needsDescriptionAuto(x, full){
 const supplier=String(x?.supplierDescription||"");
 if(plainLen(supplier)<80) return false; // без фактов XML описание автоматически не трогаем

 return plainLen(cur)<350 || /&lt;|&gt;|```/i.test(cur);
}

}
function saveAutoDone(set){ localStorage.setItem("primetac_auto_done_v9",JSON.stringify([...set])); }
function clearAutopilotProgress(){ localStorage.removeItem("primetac_auto_done_v9"); autoLog("Прогресс сброшен.","auto-skip"); }

async function startAutopilot(){
 if(window.AUTO_RUNNING) return;
 const pin=document.getElementById("autoPin")?.value||"";
 if(!pin){ alert("Введи WRITE_PIN"); return; }
 const batch=Number(document.getElementById("autoBatch")?.value||50);
 const full=document.getElementById("autoTextMode")?.value==="full";
 const marketMode=document.getElementById("autoMarket")?.value||"top30";
 const doName=document.getElementById("autoName")?.checked!==false;
 const doDesc=document.getElementById("autoDesc")?.checked!==false;
 const doPrice=document.getElementById("autoPrice")?.checked!==false;
 const autoContinue=document.getElementById("autoContinue")?.checked!==false;
 const topIds=new Set((window.AD_CANDIDATES||[]).map(x=>String(x.product.id)));
 let queue=autoEligibleItems();
 const done=autoDoneSet();
 queue=queue.filter(x=>!done.has(String(x.product.id))).slice(0,batch);
 if(!queue.length){ autoLog("Нет новых товаров в выбранной очереди.","auto-skip"); return; }

 window.AUTO_RUNNING=true; window.AUTO_STOP=false;
 let ok=0, skipped=0, errors=0;
 const summary=document.getElementById("autoSummary");

 for(let i=0;i<queue.length;i++){
   if(window.AUTO_STOP) break;
   const x=queue[i]; const id=String(x.product.id); const policy=productPolicy(x);
   if(summary) summary.textContent=`Обрабатываю ${i+1}/${queue.length}: ${x.product.name}`;
   autoLog(`→ ${x.product.name} | скидка ${policy.discount}% | Econom ${policy.commission}% | цель ≥${policy.target}% чистыми`);

   try{
     const needName=doName && needsNameAuto(x,full);
     const needDesc=doDesc && needsDescriptionAuto(x,full);
     let proposal=null;

     if(needName || needDesc){
       proposal=await j("/api/editor/propose",{
         method:"POST",headers:{"Content-Type":"application/json"},
         body:JSON.stringify({productId:id,targetMargin:policy.target,changePrice:false,changeName:needName,changeDescription:needDesc})
       });
     }

     let price=null;
     const current=Number(x.promPrice||0);
     const safeFloor=Number(x.recommendedNet20||x.recommended20||policy.safePrice||0);
     const currentNet=Number(x.netMarginPct??-999);

     if(doPrice && safeFloor>0 && (currentNet<20 || current<safeFloor)){
       price=safeFloor;
       autoLog(`  базовая цена → ${safeFloor} грн, чтобы после Econom осталось ≥20% чистыми`,"auto-ok");
     }

     const shouldMarket=doPrice && marketMode!=="off" && (marketMode==="all" || topIds.has(id) || Number(x.score||0)>=75);
     if(shouldMarket){
       const r=await fetch("/api/market/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({productId:id,minMargin:20})});
       const m=await r.json();
       if(r.ok){
         const exact=(m.competitors||[]).filter(c=>c.match==="exact").length;
         const candidate=Number(m.recommendedPrice||0);
         if(exact>=2 && candidate>0 && Number(m.expectedMargin||0)>=20){
           const base=price!=null?price:current;
           if(!base || Math.abs(candidate-base)/base>=0.015){
             price=candidate;
             autoLog(`  рынок: ${candidate} грн · чистая маржа ${m.expectedMargin}% · exact=${exact}`,"auto-ok");
           }
         }else{
           autoLog(`  рынок не меняет базовую цену: exact=${exact}, ${m.status||"нет безопасной рыночной цены"}`,"auto-skip");
         }
       }else{
         autoLog(`  рынок не проверен: ${m.error||"ошибка"}; базовая безопасная цена сохраняется`,"auto-skip");
       }
     }

     const payload={productId:id,confirm:"APPLY"};
     if(price!=null) payload.price=price;
     if(needName && proposal?.proposedName) payload.name=proposal.proposedName;
     if(needDesc && proposal?.proposedDescription){
       if(proposal.groundingSafe===true) payload.description=proposal.proposedDescription;
       else autoLog(`  описание пропущено: ${(proposal.groundingIssues||[]).join("; ")||"grounding risk"}`,"auto-skip");
     }

     if(Object.keys(payload).length<=2){
       skipped++; done.add(id); saveAutoDone(done); autoLog("  изменений не требуется.","auto-skip"); continue;
     }

     const ar=await fetch("/api/editor/apply",{
       method:"POST",headers:{"Content-Type":"application/json","X-Write-Pin":pin},body:JSON.stringify(payload)
     });
     const ao=await ar.json();
     if(!ar.ok) throw new Error(ao.error||"Prom edit error");
     ok++; done.add(id); saveAutoDone(done);
     const parts=[]; if(payload.name) parts.push("название"); if(payload.description) parts.push("описание"); if(payload.price) parts.push(`цена ${payload.price} грн`);
     autoLog(`✓ применено: ${parts.join(", ")}`,"auto-ok");
   }catch(e){
     errors++; autoLog(`✗ ${e.message}`,"auto-err");
   }
 }

 window.AUTO_RUNNING=false;
 if(summary) summary.innerHTML=`Готово: <b class="good">${ok} изменено</b> · ${skipped} без изменений · <span class="bad">${errors} ошибок</span>.`;

 if(autoContinue && !window.AUTO_STOP){
   const left=autoEligibleItems().filter(x=>!autoDoneSet().has(String(x.product.id))).length;
   if(left>0){
     autoLog(`Автопродолжение: осталось ${left} товаров. Следующий проход через 2 секунды.`,"auto-skip");
     setTimeout(()=>startAutopilot(),2000);
   }else{
     autoLog("✓ Весь выбранный каталог обработан.","auto-ok");
     if(summary) summary.innerHTML+=` <b class="good">Весь выбранный каталог обработан.</b>`;
   }
 }
}

 const d=window.MARKUP20_PREVIEW;
 if(!d) return previewMarkup20();
 const pin=document.getElementById("markup20Pin")?.value||"";
 if(!pin){ alert("Введи WRITE_PIN"); return; }
 if(window.MARKUP20_RUNNING) return;
 if(!confirm(`Изменить цены у ${d.ready} товаров по формуле закупка × 1.20?`)) return;

 window.MARKUP20_RUNNING=true;
 const ready=(d.rows||[]).filter(x=>x.matched && x.targetPrice);
 const chunks=[];
 for(let i=0;i<ready.length;i+=50) chunks.push(ready.slice(i,i+50));

 let ok=0, fail=0, done=0;
 const box=$("#markup20Progress");
 box.innerHTML=`<div class="card">
   <b>Идёт массовое изменение цен…</b>
   <div class="markup20-progress"><div id="markup20Bar"></div></div>
   <div id="markup20Stats">0 / ${ready.length}</div>
   <div id="markup20Log" class="small muted" style="max-height:280px;overflow:auto;margin-top:10px"></div>
 </div>`;

 for(const chunk of chunks){
   try{
     const r=await fetch("/api/markup20/apply",{
       method:"POST",
       headers:{"Content-Type":"application/json"},
       body:JSON.stringify({pin,productIds:chunk.map(x=>x.productId)})
     });
     const jx=await r.json();
     if(!r.ok) throw new Error(jx.error||"Ошибка пакетного изменения");

     ok += Number(jx.success||0);
     fail += Number(jx.failed||0);

     const log=document.getElementById("markup20Log");
     (jx.results||[]).forEach(x=>{
       const div=document.createElement("div");
       div.className=x.ok?"good":"bad";
       div.textContent=x.ok
         ? `✓ ID ${x.productId}: ${x.oldPrice} → ${x.newPrice} грн | закупка ${x.buyPrice} | +${x.markupPct}%`
         : `✗ ID ${x.productId}: ${x.error}`;
       log.appendChild(div);
     });
     log.scrollTop=log.scrollHeight;
   }catch(e){
     fail += chunk.length;
     const log=document.getElementById("markup20Log");
     const div=document.createElement("div");
     div.className="bad";
     div.textContent=`Ошибка пачки: ${e.message}`;
     log.appendChild(div);
   }

   done += chunk.length;
   const pct=ready.length?Math.round(done/ready.length*100):100;
   const bar=document.getElementById("markup20Bar");
   if(bar) bar.style.width=pct+"%";
   const stats=document.getElementById("markup20Stats");
   if(stats) stats.innerHTML=`${done} / ${ready.length} · <b class="good">${ok} изменено</b> · <b class="bad">${fail} ошибок</b>`;
   await new Promise(r=>setTimeout(r,250));
 }

 window.MARKUP20_RUNNING=false;
 const stats=document.getElementById("markup20Stats");
 if(stats) stats.innerHTML+=`<br><b class="good">Готово. Все надёжно сопоставленные товары обработаны.</b>`;
}

health();
</script>
</body>
</html>
